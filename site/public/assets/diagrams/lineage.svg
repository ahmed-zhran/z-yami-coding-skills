<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="lineageTitle lineageDesc">
  <title id="lineageTitle">Branch lineage</title>
  <desc id="lineageDesc">Ticket lands into spec, spec lands into release, release lands into main. The checked-out branch is never the base.</desc>
  <style>
    .panel { fill: #0d1118; stroke: #2a3344; stroke-width: 1.5; }
    .panel-main { fill: #102433; stroke: #3db4ff; stroke-width: 1.75; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15px; font-weight: 600; fill: #e8edf5; }
    .sub { font-family: "Sora", "Segoe UI", sans-serif; font-size: 12px; fill: #8b95a8; }
    .flow { stroke: #3db4ff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 120; }
    .note { font-family: "Sora", "Segoe UI", sans-serif; font-size: 12px; fill: #8b95a8; }
    .node-glow { fill: #3db4ff; opacity: 0.12; }
  </style>
  <defs>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3db4ff"/>
    </marker>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3db4ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3db4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8eb6ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect x="20" y="36" width="880" height="96" rx="4" fill="url(#railGrad)" opacity="0.35"/>

  <circle class="node-glow" cx="104" cy="84" r="54"/>
  <rect class="panel" x="24" y="48" width="160" height="72" rx="2"/>
  <text class="label" x="104" y="80" text-anchor="middle">ticket</text>
  <text class="sub" x="104" y="100" text-anchor="middle">worktree from base</text>

  <path class="flow" d="M194 84 H246" marker-end="url(#arrowHead)"/>

  <circle class="node-glow" cx="336" cy="84" r="54"/>
  <rect class="panel" x="256" y="48" width="160" height="72" rx="2"/>
  <text class="label" x="336" y="80" text-anchor="middle">spec/&lt;issue&gt;</text>
  <text class="sub" x="336" y="100" text-anchor="middle">feature branch</text>

  <path class="flow" d="M426 84 H478" marker-end="url(#arrowHead)"/>

  <circle class="node-glow" cx="568" cy="84" r="54"/>
  <rect class="panel" x="488" y="48" width="160" height="72" rx="2"/>
  <text class="label" x="568" y="80" text-anchor="middle">release/&lt;N&gt;</text>
  <text class="sub" x="568" y="100" text-anchor="middle">release train</text>

  <path class="flow" d="M658 84 H710" marker-end="url(#arrowHead)"/>

  <circle class="node-glow" cx="800" cy="84" r="58"/>
  <rect class="panel-main" x="720" y="48" width="160" height="72" rx="2"/>
  <text class="label" x="800" y="80" text-anchor="middle">main</text>
  <text class="sub" x="800" y="100" text-anchor="middle">you approve the PR</text>

  <text class="note" x="460" y="188" text-anchor="middle">Ship doors: /ship-ticket → /ship-spec → /ship-release. Each level lands under that session’s authority.</text>
  <text class="note" x="460" y="210" text-anchor="middle">The checked-out branch is never the recorded base.</text>
</svg>
